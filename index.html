<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Capacity Partner API</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --brand: #FF9933;
      --bg-page: #FAFAFA;
      --bg-surface: #FFFFFF;
      --text-primary: #18181B;
      --text-secondary: #52525B;
      --border: #E4E4E7;
      --link: #1570EF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg-page);
      color: var(--text-primary);
      font: 400 16px/1.5 "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 24px;
    }
    .brand { margin-bottom: 24px; } .brand img { display: block; height: 40px; width: auto; }
    .eyebrow {
      font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--brand); margin: 0 0 8px;
    }
    h1 { font-size: 28px; line-height: 1.3; margin: 0 0 12px; }
    p { margin: 0 0 12px; color: var(--text-secondary); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="capacity-logo.png" alt="Capacity" height="40"></div>
    <p class="eyebrow">Coming soon</p>
    <h1>Capacity Partner API documentation</h1>
    <p>Guides, a quickstart and a full API reference for integrating with Capacity fulfillment are on the way.</p>
    <p>Need credentials or help now? Email <a href="mailto:itedi@capacityllc.com">itedi@capacityllc.com</a>.</p>
  </main>
</body>
</html>
